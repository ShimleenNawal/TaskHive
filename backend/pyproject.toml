[project]
name = "taskhive-backend"
version = "0.1.0"
description = "TaskHive - Full-stack task management app"
authors = [
    {name = "Shimleen"}
]
license = "MIT"
package-mode = false
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "fastapi-mail (>=1.5.8,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
